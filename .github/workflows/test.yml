name: Run Tests

on:
  push:
    branches:
      - "**"  # Change if using a different default branch
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Show Repository Structure (Debugging)
        run: ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # Change to your Python version if needed

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest  # Ensure pytest is installed
          pip install -r requirements.txt || true  # Install dependencies if a requirements.txt exists

      - name: Run Tests
        run: pytest tests/ --maxfail=1 --disable-warnings
